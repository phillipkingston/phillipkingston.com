<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 114 114" width="114" height="114" role="img" aria-labelledby="t">
<title id="t">The Maclaine of Lochbuie tartan: a 114-thread sett in red, hunting green, azure and yellow.</title>
